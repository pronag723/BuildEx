name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail loudly if the Supabase secrets weren't wired into the build.
      # Without them the deployed site bakes empty strings into the JS bundle,
      # auth shows "isn't configured", and the failure is silent at deploy
      # time. Most common cause: secrets added as Environment secrets instead
      # of Repository secrets (this `build` job has no `environment:` field
      # so it can only see Repository secrets).
      - name: Verify Supabase secrets are available
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is empty. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets (NOT Environment secrets)."
            missing=1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL is set (length=${#NEXT_PUBLIC_SUPABASE_URL})"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is empty. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets (NOT Environment secrets)."
            missing=1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is set (length=${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"
          fi
          exit $missing

      # Cloudflare Web Analytics is optional: without the token the site is
      # built without the beacon, so warn rather than fail.
      - name: Check Cloudflare Web Analytics token
        env:
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_CF_ANALYTICS_TOKEN" ]; then
            echo "::warning::NEXT_PUBLIC_CF_ANALYTICS_TOKEN is empty, so this build has no Cloudflare Web Analytics. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
          else
            echo "NEXT_PUBLIC_CF_ANALYTICS_TOKEN is set (length=${#NEXT_PUBLIC_CF_ANALYTICS_TOKEN})"
          fi

      # The Turnstile site key (public) switches on the bot check in front of
      # "Send code" on /login. Without it the build sends no CAPTCHA token, so
      # warn rather than fail: that is right until CAPTCHA is switched on in
      # Supabase, and once it is, email sign-in breaks without the key.
      - name: Check Cloudflare Turnstile site key
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::warning::NEXT_PUBLIC_TURNSTILE_SITE_KEY is empty, so this build has no Turnstile on /login and email sign-in sends no CAPTCHA token. If CAPTCHA is on in Supabase (Authentication -> Attack Protection), email sign-in is broken. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
          else
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY is set (length=${#NEXT_PUBLIC_TURNSTILE_SITE_KEY})"
          fi

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
