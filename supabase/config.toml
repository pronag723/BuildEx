# Supabase local/deploy config. Only the function declarations matter for this
# project (the database itself is managed by pasting supabase/migrations/*.sql
# into the SQL editor). project_id is just a local label.
project_id = "buildex"

# ─── Edge Functions ──────────────────────────────────────────────────────────
# The payment, payout and ready-build functions were removed with the money
# layer; account deletion is the only Edge Function left.
#
# The function validates the Authorization token with auth.getUser() itself.
# Keep gateway verification off because this project uses asymmetric ES256 keys
# and the gateway can lag behind Auth's key set during key rotation.
[functions.delete-account]
verify_jwt = false
